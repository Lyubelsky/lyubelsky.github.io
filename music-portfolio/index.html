<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060816;
      --panel: rgba(15, 22, 42, 0.9);
      --panel-2: rgba(24, 34, 58, 0.96);
      --accent: #7c4dff;
      --accent-2: #00e5ff;
      --accent-soft: rgba(124, 77, 255, 0.18);
      --text: #f5f7ff;
      --muted: #8a93b2;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124, 77, 255, 0.24), transparent 28%),
        radial-gradient(circle at bottom right, rgba(0, 229, 255, 0.2), transparent 32%),
        linear-gradient(135deg, #08101f 0%, var(--bg) 45%, #02030b 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 1040px);
      background: linear-gradient(145deg, rgba(15, 22, 42, 0.94), rgba(8, 13, 28, 0.96));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .hero {
      padding: 32px 32px 22px;
      background: linear-gradient(135deg, rgba(124, 77, 255, 0.28), rgba(0, 229, 255, 0.16));
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(2px);
    }

    .hero::before {
      inset: -60px auto auto -80px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(124, 77, 255, 0.22), transparent 70%);
    }

    .hero::after {
      inset: auto -40px -60px auto;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.22), transparent 70%);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 2.5vw, 2.35rem);
      letter-spacing: 0.02em;
    }

    .hero p {
      margin: 0;
      color: #dce3ff;
      max-width: 760px;
      line-height: 1.7;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    .controls {
      padding: 18px 32px 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .statusbar {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .playlist {
      display: grid;
      gap: 14px;
      padding: 20px 32px 32px;
    }

    .track-card {
      background: linear-gradient(145deg, rgba(24, 34, 58, 0.97), rgba(14, 21, 38, 0.98));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 16px 14px;
      display: grid;
      gap: 12px;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 10px 20px rgba(0, 0, 0, 0.18);
    }

    .track-card:hover {
      transform: translateY(-2px);
      border-color: rgba(124, 77, 255, 0.4);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 16px 28px rgba(0, 0, 0, 0.24);
    }

    .track-card.is-playing {
      border-color: rgba(0, 229, 255, 0.42);
      background: linear-gradient(145deg, rgba(28, 40, 68, 0.98), rgba(18, 26, 46, 0.98));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 18px 30px rgba(0, 0, 0, 0.26);
    }

    .track-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .track-info {
      min-width: 0;
      flex: 1;
    }

    .track-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .track-title {
      font-weight: 700;
      letter-spacing: 0.01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 1rem;
      color: #ffb36b;
      text-shadow: 0 0 18px rgba(255, 179, 107, 0.15);
    }

    .track-description {
      color: #dbe4ff;
      font-size: 0.95rem;
      line-height: 1.55;
      opacity: 0.92;
      margin: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.12);
      transform: scale(1.04);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .icon-btn.is-active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 2px;
    }

    .time-pill {
      color: var(--muted);
      font-size: 0.82rem;
      min-width: 40px;
      text-align: center;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-2);
      cursor: pointer;
      height: 6px;
      border-radius: 999px;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 0 4px rgba(0, 229, 255, 0.16);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 18px 10px 6px;
      font-size: 1rem;
    }

    @media (max-width: 680px) {
      body { padding: 16px; }
      .hero { padding: 24px 20px 18px; }
      .controls { padding: 14px 20px 0; }
      .playlist { padding: 16px 20px 20px; }
      .track-top { flex-direction: column; align-items: flex-start; }
      .actions { width: 100%; justify-content: flex-start; }
      .hero-top { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1>Music Portfolio</h1>
          <p>Each song is original and does not use any AI assistance.
          </p>
        </div>
      </div>
    </section>

    <section class="controls">
      <div id="status" class="statusbar">Loading music...</div>
    </section>

    <section id="playlist" class="playlist">
      <div class="empty">No music loaded yet.</div>
    </section>
  </main>

  <script>
    const playlist = document.getElementById('playlist');
    const status = document.getElementById('status');
    const players = [];

    const musicFolder = './music';
    const musicFiles = [
      { fileName: 'deep.mp3', description: 'Mystery' },
      { fileName: 'mystical.mp3', description: 'Fantasy' },
      { fileName: 'farize.mp3', description: 'Action' },
      { fileName: 'dropley.mp3', description: 'Atmospheric' },
      { fileName: 'glitch.mp3', description: 'Action' },
      { fileName: 'horrify.mp3', description: 'Horror' },
      { fileName: 'twink.mp3', description: 'Fantasy' },
      { fileName: 'vero.mp3', description: 'Fantasy' },
      { fileName: 'waterwind.mp3', description: 'Fantasy' },
      { fileName: 'snap.mp3', description: 'Happy' },
      { fileName: 'kandom.mp3', description: 'Fantasy' },
      { fileName: 'splinker.mp3', description: 'Happy' },
      { fileName: 'rainy-night.mp3', description: 'Timely' },
      { fileName: 'beyact.mp3', description: 'Action' },
      { fileName: 'onlyx.mp3', description: 'Horror' },
      { fileName: 'belew.mp3', description: 'Happy' },
    ];

    function toTitleCase(text) {
      return text
        .replace(/[_-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .split(' ')
        .filter(Boolean)
        .map((word) => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .join(' ');
    }

    function createTrackCard(entry) {
      const fileName = entry.fileName;
      const description = entry.description || '';
      const card = document.createElement('article');
      card.className = 'track-card';

      const audio = document.createElement('audio');
      audio.src = `${musicFolder}/${encodeURIComponent(fileName)}`;
      audio.preload = 'metadata';

      const top = document.createElement('div');
      top.className = 'track-top';

      const info = document.createElement('div');
      info.className = 'track-info';

      const titleRow = document.createElement('div');
      titleRow.className = 'track-title-row';
      const titleEl = document.createElement('div');
      titleEl.className = 'track-title';
      titleEl.textContent = toTitleCase(fileName.replace(/\.[^.]+$/i, ''));
      titleRow.appendChild(titleEl);

      const descEl = document.createElement('p');
      descEl.className = 'track-description';
      descEl.textContent = description;
      info.append(titleRow, descEl);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const playBtn = document.createElement('button');
      playBtn.className = 'icon-btn';
      playBtn.textContent = '▶';
      playBtn.title = 'Play / Pause';

      const loopBtn = document.createElement('button');
      loopBtn.className = 'icon-btn';
      loopBtn.textContent = '↺';
      loopBtn.title = 'Loop track';

      let loopEnabled = false;

      actions.append(playBtn, loopBtn);
      top.append(info, actions);

      const progressWrap = document.createElement('div');
      progressWrap.className = 'progress-wrap';
      const timeEl = document.createElement('span');
      timeEl.className = 'time-pill';
      timeEl.textContent = '0:00';
      const range = document.createElement('input');
      range.type = 'range';
      range.min = '0';
      range.max = '100';
      range.value = '0';
      range.step = '0.1';
      const totalEl = document.createElement('span');
      totalEl.className = 'time-pill';
      totalEl.textContent = '0:00';
      progressWrap.append(timeEl, range, totalEl);

      card.append(top, progressWrap, audio);
      playlist.appendChild(card);

      const updateDisplay = () => {
        const current = audio.currentTime || 0;
        const duration = audio.duration || 0;
        const pct = duration ? (current / duration) * 100 : 0;
        range.value = pct;
        timeEl.textContent = formatTime(current);
        totalEl.textContent = formatTime(duration);
        playBtn.textContent = audio.paused ? '▶' : '⏸';
        card.classList.toggle('is-playing', !audio.paused);
      };

      playBtn.addEventListener('click', async () => {
        const isPlaying = !audio.paused;
        players.forEach((player) => {
          if (player.audio !== audio) {
            player.audio.pause();
            player.playBtn.textContent = '▶';
            player.card.classList.remove('is-playing');
          }
        });

        if (isPlaying) {
          audio.pause();
          playBtn.textContent = '▶';
          card.classList.remove('is-playing');
        } else {
          try {
            await audio.play();
            playBtn.textContent = '⏸';
            card.classList.add('is-playing');
          } catch (error) {
            console.error('Playback failed', error);
            status.textContent = 'Playback was blocked by the browser. Try again.';
          }
        }
      });

      loopBtn.addEventListener('click', () => {
        loopEnabled = !loopEnabled;
        audio.loop = loopEnabled;
        loopBtn.classList.toggle('is-active', loopEnabled);
        loopBtn.title = loopEnabled ? 'Looping enabled' : 'Loop track';
      });

      range.addEventListener('input', () => {
        if (!Number.isFinite(audio.duration)) return;
        audio.currentTime = (Number(range.value) / 100) * audio.duration;
      });

      audio.addEventListener('timeupdate', updateDisplay);
      audio.addEventListener('loadedmetadata', updateDisplay);
      audio.addEventListener('play', () => {
        playBtn.textContent = '⏸';
        players.forEach((player) => {
          if (player.audio !== audio) {
            player.playBtn.textContent = '▶';
            player.card.classList.remove('is-playing');
          }
        });
        card.classList.add('is-playing');
      });
      audio.addEventListener('pause', updateDisplay);
      audio.addEventListener('ended', () => {
        playBtn.textContent = '▶';
        card.classList.remove('is-playing');
        range.value = '0';
        timeEl.textContent = '0:00';
      });

      players.push({ audio, playBtn, card });
      updateDisplay();
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function loadTracks() {
      players.splice(0, players.length);
      playlist.innerHTML = '';

      if (!musicFiles.length) {
        playlist.innerHTML = '<div class="empty">No audio files were found in the defined folder.</div>';
        status.textContent = 'No audio files were found.';
        return;
      }

      musicFiles.forEach(createTrackCard);
      status.textContent = `Loaded ${musicFiles.length} piece${musicFiles.length === 1 ? '' : 's'}.`;
    }

    loadTracks();
  </script>
</body>
</html>
