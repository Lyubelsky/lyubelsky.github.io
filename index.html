<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="🔥 Welcome to Lyubelsky. 🎁 Games, assets, software. ❤️ One great place.">
  <title>Lyubelsky</title>
  <link rel="shortcut icon" href="favicon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400&display=swap');
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Fredoka", system-ui;
      overflow: hidden;
      background: linear-gradient(140deg, #04122f 0%, #4C0E5C 55%, #380505 100%);
    }

    /* Purple gradient circles */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 18%, rgba(162, 78, 255, 0.50) 0%, rgba(162, 78, 255, 0) 46%),
        radial-gradient(circle at 82% 22%, rgba(120, 60, 255, 0.38) 0%, rgba(120, 60, 255, 0) 48%),
        radial-gradient(circle at 26% 78%, rgba(210, 90, 255, 0.30) 0%, rgba(210, 90, 255, 0) 52%),
        radial-gradient(circle at 88% 82%, rgba(106, 45, 220, 0.28) 0%, rgba(106, 45, 220, 0) 56%);
      filter: blur(1px);
    }

    .wrap {
      position: relative;
      height: 100%;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      padding: 24px;
    }

    .card {
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 18px 22px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .title {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.2px;
    }

    .sub {
      margin: 10px 0 0 0;
      font-size: 13px;
      opacity: 0.85;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="title">Loading...</p>
      <p class="sub">lyubelsky.itch.io</p>
    </div>
  </div>

  <script>
    window.location.replace("https://lyubelsky.itch.io/");
  </script>
</body>
</html>
